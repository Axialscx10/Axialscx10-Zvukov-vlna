<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A090F" />
      <stop offset="50%" stop-color="#14111D" />
      <stop offset="100%" stop-color="#241014" />
    </linearGradient>

    <radialGradient id="glowRed" cx="30%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF2A4D" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FF2A4D" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowCyan" cx="80%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="eqCyan" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00A2C7" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <linearGradient id="eqCrimson" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#9C0028" />
      <stop offset="100%" stop-color="#FF385C" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)" />
  <rect width="1280" height="720" fill="url(#glowRed)" />
  <rect width="1280" height="720" fill="url(#glowCyan)" />

  <!-- Subtle vinyl grooves background watermark -->
  <g opacity="0.4" transform="translate(260, 360)">
    <circle r="340" fill="none" stroke="#252438" stroke-width="1.5" />
    <circle r="300" fill="none" stroke="#1F1E2E" stroke-width="1.5" />
    <circle r="260" fill="none" stroke="#2D2B3F" stroke-width="1.5" />
    <circle r="220" fill="none" stroke="#1F1E2E" stroke-width="1.5" />
    <circle r="180" fill="none" stroke="#2D2B3F" stroke-width="2" />
  </g>

  <!-- Left Vinyl Record -->
  <g transform="translate(260, 360)">
    <!-- Vinyl Disc Outer -->
    <circle r="190" fill="#15141D" stroke="#36344A" stroke-width="4" />
    <circle r="170" fill="none" stroke="#00E5FF" stroke-opacity="0.2" stroke-width="1.5" />
    <circle r="145" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5" />
    <circle r="120" fill="none" stroke="#00E5FF" stroke-opacity="0.25" stroke-width="1.5" />
    <circle r="95" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5" />
    <!-- Center Label -->
    <circle r="68" fill="#FF2A4D" />
    <circle r="60" fill="#E61C3F" />
    <circle r="24" fill="#0D0C13" />
    <!-- Play Triangle inside center -->
    <polygon points="-8,-16 16,0 -8,16" fill="#FFFFFF" />
  </g>

  <!-- SoundWave Branding & Text on Right Side -->
  <g transform="translate(530, 240)">
    <!-- Small Category Pill -->
    <rect x="0" y="0" width="220" height="34" rx="17" fill="#FF2A4D" fill-opacity="0.2" stroke="#FF2A4D" stroke-width="1" />
    <text x="110" y="22" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FF6B82" text-anchor="middle" letter-spacing="1.5">GOOGLE TV &amp; ANDROID</text>

    <!-- Main Title -->
    <text x="0" y="105" font-family="sans-serif" font-size="76" font-weight="900" fill="#FFFFFF" letter-spacing="-1">SoundWave</text>

    <!-- Subtitle -->
    <text x="2" y="150" font-family="sans-serif" font-size="24" font-weight="600" fill="#00E5FF" letter-spacing="0.5">Hi-Res Player pre Navidrome &amp; Subsonic</text>

    <!-- Description / Badges Row -->
    <g transform="translate(2, 185)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="145" height="32" rx="6" fill="#1C1B27" stroke="#38364E" stroke-width="1" />
      <text x="72" y="21" font-family="sans-serif" font-size="13" font-weight="bold" fill="#E0DFEB" text-anchor="middle">FLAC 24-BIT</text>

      <!-- Badge 2 -->
      <rect x="160" y="0" width="145" height="32" rx="6" fill="#1C1B27" stroke="#38364E" stroke-width="1" />
      <text x="232" y="21" font-family="sans-serif" font-size="13" font-weight="bold" fill="#00E5FF" text-anchor="middle">10-BAND DSP EQ</text>

      <!-- Badge 3 -->
      <rect x="320" y="0" width="160" height="32" rx="6" fill="#1C1B27" stroke="#38364E" stroke-width="1" />
      <text x="400" y="21" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FF6B82" text-anchor="middle">REMOTE CONTROL</text>
    </g>
  </g>

  <!-- Equalizer Visualizer Bars at the Bottom-Right -->
  <g transform="translate(680, 500)">
    <rect x="0" y="80" width="16" height="60" rx="8" fill="url(#eqCyan)" opacity="0.8" />
    <rect x="28" y="40" width="16" height="100" rx="8" fill="url(#eqCyan)" />
    <rect x="56" y="20" width="16" height="120" rx="8" fill="url(#eqCrimson)" />
    <rect x="84" y="60" width="16" height="80" rx="8" fill="url(#eqCrimson)" />
    <rect x="112" y="10" width="16" height="130" rx="8" fill="url(#eqCrimson)" />
    <rect x="140" y="45" width="16" height="95" rx="8" fill="url(#eqCyan)" />
    <rect x="168" y="70" width="16" height="70" rx="8" fill="url(#eqCyan)" />
    <rect x="196" y="30" width="16" height="110" rx="8" fill="url(#eqCrimson)" />
    <rect x="224" y="55" width="16" height="85" rx="8" fill="url(#eqCyan)" opacity="0.85" />
    <rect x="252" y="90" width="16" height="50" rx="8" fill="url(#eqCyan)" opacity="0.6" />
  </g>
</svg>
